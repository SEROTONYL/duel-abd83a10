<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дуэль идей</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0a0b;--ink:#b8b0a4;--dim:#5d574f;--line:#221f1c;--hi:#e8dfd0;--card:#0e0e10}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,"Times New Roman",serif;
       display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
       height:100dvh;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
       -webkit-tap-highlight-color:transparent;touch-action:manipulation;
       -webkit-user-select:none;user-select:none;overscroll-behavior:none}

  header{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--line)}
  .dots{display:flex;gap:3px;flex:1 1 auto;min-width:0;overflow:hidden}
  .dot{width:5px;height:5px;border-radius:50%;background:#211e1b;flex:0 0 auto;transition:background .2s}
  .dot.done{background:#645a49}.dot.now{background:var(--hi)}
  .count{flex:0 0 auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .bar{display:none;flex:1 1 auto;height:2px;background:#211e1b;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#7a6f5f;transition:width .25s}
  .phase{flex:0 0 auto;font-style:italic;color:var(--dim);font-size:12.5px}

  main{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px;
       padding:18px 18px 10px;min-height:0;min-width:0}
  .card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:20px;min-height:0;min-width:0;cursor:pointer;border:1px solid var(--line);
        background:var(--card);border-radius:2px;padding:22px 26px;
        transition:opacity .3s ease,border-color .2s,transform .3s cubic-bezier(.2,.7,.3,1)}
  .card svg{width:100%;max-width:500px;height:auto;max-height:58vh;color:#a89f92;display:block;
            transition:color .3s}
  .card .t{font-size:17.5px;line-height:1.45;text-align:center;color:var(--ink);max-width:22em;
           transition:color .3s}
  .card .m{font-size:13px;color:#7a7266;letter-spacing:.02em;text-align:center;margin-top:-9px}
  .card .f{font-size:12.5px;color:#585149;letter-spacing:.02em;text-align:center;margin-top:-14px;font-style:italic}
  .card:hover .m{color:#9b9184} .card:hover .f{color:#7a7266}
  .card .q{position:absolute;right:8px;top:7px;width:26px;height:26px;border-radius:50%;
    border:1px solid #2e2a25;background:none;color:#5d574f;font:13px Georgia,serif;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;line-height:1;z-index:2}
  .card .q:hover{border-color:#6b5f4c;color:var(--hi)}
  body.picked .card .q{display:none}
  #help{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(6,6,7,.86);padding:22px}
  #help.on{display:flex}
  #help .box{max-width:620px;border:1px solid #332e28;background:#0e0e10;padding:26px 28px 22px;
    border-radius:3px;max-height:86vh;overflow:auto}
  #help h2{font:italic 300 20px/1.35 Georgia,serif;color:var(--hi);margin-bottom:14px}
  #help p{font-size:16px;line-height:1.65;color:var(--ink)}
  #help .meta{margin-top:16px;font-size:13.5px;color:var(--dim);line-height:1.6}
  #help .close{margin-top:22px;background:none;border:1px solid #332e28;color:var(--ink);
    font:13px Georgia,serif;padding:8px 18px;cursor:pointer}
  #help .close:hover{border-color:#554c42;color:var(--hi)}
  .card .k{position:absolute;left:9px;top:6px;font-size:11.5px;color:#2f2b26}
  .card .km{display:none}
  .card:hover{border-color:#3a342d}
  .card:hover svg{color:var(--hi)}.card:hover .t{color:var(--hi)}

  body.picked .card{cursor:default;opacity:.14}
  body.picked .card.chosen{opacity:1;border-color:#4a4238}
  body.picked .card.chosen svg{color:var(--hi)}
  body.picked .card.chosen .t{color:var(--hi)}
  body.nonepicked .card{opacity:.14}

  footer{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 20px 12px;
         display:flex;align-items:center;gap:18px;min-height:46px}
  .hint{color:#4e4841;font-size:12.5px;letter-spacing:.03em;flex:1 1 auto}
  .quit{background:none;border:1px solid #2b2621;color:var(--dim);font:12px Georgia,serif;
        padding:5px 12px;cursor:pointer;letter-spacing:.03em;visibility:hidden}
  .quit:hover{border-color:#554c42;color:var(--hi)}
  .quit.on{visibility:visible}
  .skip{display:none;background:none;border:1px solid #2b2621;color:var(--dim);
        font:13px Georgia,serif;padding:9px 16px;cursor:pointer;letter-spacing:.03em;border-radius:2px}
  .skip:active{border-color:#554c42;color:var(--hi)}

  #end{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;
       flex-direction:column;padding:34px 30px;overflow:auto}
  #end.on{display:flex}
  #end h1{font:italic 300 26px/1.3 Georgia,serif;color:var(--hi);margin-bottom:6px}
  #end .sub{color:var(--dim);font-size:13px;margin-bottom:26px;max-width:52em;line-height:1.6}
  .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px;max-width:1200px}
  .res figure{display:flex;flex-direction:column;gap:9px;border:1px solid var(--line);
              background:var(--card);padding:14px 14px 16px;border-radius:2px}
  .res svg{width:100%;height:auto;color:#a89f92}
  .res .w{color:var(--hi);font-size:14px;line-height:1.4}
  .res .n{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
  .btn{margin-top:28px;align-self:flex-start;background:none;border:1px solid #332e28;
       color:var(--ink);font:13px Georgia,serif;padding:8px 16px;cursor:pointer;letter-spacing:.04em}
  .btn:hover{border-color:#554c42;color:var(--hi)}

  body.bare .card{justify-content:center}
  body.bare .card .t{font-size:21px;line-height:1.5;max-width:15em}

  /* ---- телефон, портрет ---- */
  @media(max-width:860px){
    header{padding:9px 14px;gap:10px}
    .dots{display:none} .bar{display:block}
    .phase{font-size:12px}
    main{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:9px;padding:9px}
    .card{padding:10px 12px;gap:9px;border-radius:3px}
    .card svg{max-width:100%;max-height:none;flex:1 1 auto;min-height:0}
    .card .t{font-size:16px;line-height:1.35;max-width:26em}
    .card .kd{display:none} .card .km{display:inline}
    .card:hover{border-color:var(--line)}
    .card:hover svg{color:#a89f92} .card:hover .t{color:var(--ink)}
    .card:active{border-color:#4a4238}
    .card:active svg{color:var(--hi)} .card:active .t{color:var(--hi)}
    body.bare .card .t{font-size:19px;max-width:14em}
    .card .m{font-size:12.5px;margin-top:-4px}
    .card .f{font-size:12px;margin-top:-6px}
    .hint{display:none}
    .skip{display:block}
    footer{padding:8px 14px 10px;gap:10px;justify-content:space-between}
    #end{padding:22px 16px}
    #end h1{font-size:21px}
    .res{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    .res figure{padding:10px}
    .res .w{font-size:13px}
  }
  /* ---- телефон, ландшафт: обратно в две колонки ---- */
  @media(max-width:900px) and (orientation:landscape){
    main{grid-template-columns:1fr 1fr;grid-template-rows:1fr;gap:8px;padding:8px}
    .card .t{font-size:14px}
    .card .kd{display:inline} .card .km{display:none}
    body.bare .card .t{font-size:17px}
  }
</style>
</head>
<body>

<header>
  <span class="phase" id="phase">дуэль</span>
  <span class="dots" id="dots"></span>
  <span class="bar"><i id="barfill"></i></span>
  <span class="count" id="count"></span>
</header>

<main id="grid"></main>

<footer>
  <span class="hint" id="hint">← или → · что взял бы. 0 — обе мимо. Не думай, отвечай сразу.</span>
  <button class="skip" id="skip">обе мимо</button>
  <button class="quit" id="quit">хватит, показать итог</button>
</footer>

<div id="help"><div class="box">
  <h2 id="helph"></h2>
  <p id="helpp"></p>
  <div class="meta" id="helpm"></div>
  <button class="close" id="helpc">понятно</button>
</div></div>

<div id="end">
  <h1 id="endh"></h1>
  <div class="sub" id="endsub"></div>
  <div class="res" id="res"></div>
  <button class="btn" id="save">сохранить файл с ответами</button>
  <button class="btn" id="again" style="margin-top:10px">пройти заново</button>
</div>

<script src="pool.js"></script>
<script>
/* ---------- расписание ---------- */
function rng(seed){let s=seed>>>0;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const ROUNDS=POOL.length>44?3:(POOL.length>34?4:5), REPEATS=10, SEED=20260907;
function buildSchedule(){
  const r=rng(SEED), n=POOL.length, seen=new Set(), duels=[];
  for(let k=0;k<ROUNDS;k++){
    let idx=shuffle([...Array(n).keys()],r);
    for(let i=0;i+1<n;i+=2){
      let a=idx[i], b=idx[i+1];
      const key=a<b?a+'-'+b:b+'-'+a;
      if(seen.has(key)){                       // пара уже была — обменять партнёра
        for(let j=i+2;j<n;j++){
          const c=idx[j], part=idx[j%2?j-1:j+1];
          if(c===undefined||part===undefined) continue;
          const alt1=a<c?a+'-'+c:c+'-'+a, alt2=b<part?b+'-'+part:part+'-'+b;
          if(!seen.has(alt1)&&!seen.has(alt2)){[idx[i+1],idx[j]]=[idx[j],idx[i+1]];b=idx[i+1];break}
        }
      }
      seen.add(a<b?a+'-'+b:b+'-'+a);
      duels.push({a,b,rep:false});
    }
  }
  // повторы: те же пары, стороны местами — замер устойчивости
  const step=Math.floor(duels.length/REPEATS), reps=[];
  for(let k=0;k<REPEATS;k++){const d=duels[k*step+Math.floor(step/2)];reps.push({a:d.b,b:d.a,rep:true,of:k*step+Math.floor(step/2)})}
  return duels.concat(shuffle(reps,r));
}

const SCHED=buildSchedule();
const KEY='idea-duel-v4', KEY2='idea-duel-p2-v4';
const P2N=10;
{ const saved=JSON.parse(localStorage.getItem(KEY2)||'null');
  if(saved) saved.forEach(d=>SCHED.push(d)); }
let cur=0, locked=false, shownAt=0, helpMs=0, helpAt=0, helped=false;
let answers=JSON.parse(localStorage.getItem(KEY)||'[]');
if(answers.length && answers.length<SCHED.length) cur=answers.length;

const grid=document.getElementById('grid');

function head(){
  const d=document.getElementById('dots'); const n=SCHED.length;
  if(d.children.length!==n) d.innerHTML=SCHED.map(()=>'<span class="dot"></span>').join('');
  [...d.children].forEach((el,i)=>{el.className='dot'+(i<cur?' done':'')+(i===cur?' now':'')});
  document.getElementById('count').textContent=(cur+1)+' / '+n;
  document.getElementById('barfill').style.width=(cur/n*100).toFixed(1)+'%';
  const cd=SCHED[cur];
  document.getElementById('phase').textContent=cd.p2?'без картинок':(cd.rep?'проверка':'дуэль');
  document.getElementById('quit').classList.toggle('on',cur>=24);
  document.getElementById('quit').textContent=cd.p2?'хватит, показать итог':'хватит, к контролю';
  document.getElementById('hint').textContent=cd.p2
    ? 'Те же идеи, но голыми строками. Проверяю, картинка выбирала или идея.'
    : '← или → · что взял бы. 0 — обе мимо. Непонятное слово — жми «?» на карточке.';
}

function render(){
  document.body.classList.remove('picked','nonepicked');
  locked=false;
  const d=SCHED[cur], A=POOL[d.a], B=POOL[d.b];
  const bare=!!d.p2;
  document.body.classList.toggle('bare',bare);
  grid.innerHTML=[A,B].map((it,i)=>
    `<div class="card" data-i="${i}"><span class="k"><b class="kd">${i?'→':'←'}</b><b class="km">${i?'↓':'↑'}</b></span>${it.d?`<button class="q" data-q="${i}" aria-label="что это">?</button>`:''}${bare?'':it.svg}<div class="t">${it.t}</div>${it.m?`<div class="m">${it.m}</div>`:''}${it.f?`<div class="f">${it.f}</div>`:''}</div>`).join('');
  grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>pick(+c.dataset.i));
  grid.querySelectorAll('.q').forEach(b=>b.onclick=e=>{e.stopPropagation(); openHelp(+b.dataset.q);});
  head();
  shownAt=performance.now(); helpMs=0; helped=false;
}

function openHelp(side){
  const d=SCHED[cur], it=POOL[side?d.b:d.a];
  if(!it.d) return;
  helpAt=performance.now(); helped=true;
  document.getElementById('helph').textContent=it.t;
  document.getElementById('helpp').textContent=it.d;
  document.getElementById('helpm').innerHTML=(it.m?it.m:'')+(it.f?'<br>'+it.f:'');
  document.getElementById('help').classList.add('on');
}
function closeHelp(){
  const h=document.getElementById('help');
  if(!h.classList.contains('on')) return;
  helpMs+=performance.now()-helpAt;
  h.classList.remove('on');
}

function pick(i){
  if(document.getElementById('help').classList.contains('on')) return;
  if(locked) return;
  if(performance.now()-shownAt<180) return;   // случайный второй тап после смены пары
  locked=true;
  const ms=Math.round(performance.now()-shownAt-helpMs);
  const d=SCHED[cur], A=POOL[d.a], B=POOL[d.b];
  if(i<0){ document.body.classList.add('nonepicked'); }
  else{
    document.body.classList.add('picked');
    grid.querySelectorAll('.card').forEach(c=>c.classList.toggle('chosen',+c.dataset.i===i));
  }
  answers[cur]={i:cur, rep:!!d.rep, p2:!!d.p2, of:d.of??null,
                left:A.id, right:B.id,
                pick:i<0?null:(i===0?A.id:B.id),
                ms, help:helped, helpMs:Math.round(helpMs), ts:new Date().toISOString()};
  localStorage.setItem(KEY,JSON.stringify(answers));
  setTimeout(()=>{
    if(cur<SCHED.length-1){cur++;render();return}
    if(!SCHED[cur].p2 && buildPhase2()){cur++;render();return}
    finish();
  }, i<0?170:260);
}

function tally(list){
  const wins={}, seen={};
  list.forEach(a=>{ [a.left,a.right].forEach(x=>seen[x]=(seen[x]||0)+1);
                    if(a.pick) wins[a.pick]=(wins[a.pick]||0)+1 });
  const rate=id=>seen[id]?(wins[id]||0)/seen[id]:0;
  const rank=POOL.map(p=>p.id).filter(id=>seen[id]).sort((x,y)=>rate(y)-rate(x)||(wins[y]||0)-(wins[x]||0));
  return {wins,seen,rank};
}

/* Контроль: те же идеи голым текстом. Верх против середины —
   там, где картинка могла перетянуть сильнее всего. */
function buildPhase2(){
  if(localStorage.getItem(KEY2)) return false;
  const {rank}=tally(answers.filter(a=>a&&!a.p2));
  if(rank.length<20) return false;
  const idx=id=>POOL.findIndex(p=>p.id===id);
  const top=rank.slice(0,5), mid=rank.slice(9,20);
  const r=rng(SEED^0x5eed), pool2=shuffle(mid.slice(),r), out=[];
  for(let k=0;k<P2N;k++){
    const t=top[k%top.length], m=pool2[k%pool2.length];
    if(t===m) continue;
    out.push(k%2 ? {a:idx(m),b:idx(t),p2:true} : {a:idx(t),b:idx(m),p2:true});
  }
  if(!out.length) return false;
  localStorage.setItem(KEY2,JSON.stringify(out));
  out.forEach(d=>SCHED.push(d));
  return true;
}

function finish(){
  const done=answers.filter(Boolean);
  const p1=done.filter(a=>!a.p2), p2=done.filter(a=>a.p2);
  const {wins,seen,rank}=tally(p1);

  const reps=done.filter(a=>a.rep&&a.of!=null&&done[a.of]);
  const same=reps.filter(a=>a.pick&&done[a.of].pick&&a.pick===done[a.of].pick).length;
  const times=done.filter(a=>a.pick).map(a=>a.ms).sort((a,b)=>a-b);
  const med=times.length?times[Math.floor(times.length/2)]:0;

  document.getElementById('endh').textContent=done.length+' дуэлей отыграно.';
  let ctrl='';
  if(p2.length){
    const held=p2.filter(a=>a.pick&&rank.slice(0,5).includes(a.pick)).length;
    ctrl='<br>Без картинок верх удержался '+held+' раз из '+p2.length+'.';
  }
  document.getElementById('endsub').innerHTML=
    'Медиана решения '+(med/1000).toFixed(1)+' с. '+
    (reps.length?('Устойчивость '+same+' из '+reps.length+' на повторах.'):'')+ctrl+
    '<br>Ниже верх твоего отбора. Это <i>отбор, а не приговор</i> — сохрани файл и скинь мне, разбор осей я сделаю сам.';
  document.getElementById('res').innerHTML=rank.slice(0,9).map(id=>{
    const p=POOL.find(x=>x.id===id);
    return `<figure>${p.svg}<span class="w">${p.t}</span>${p.m?`<span class="n">${p.m}</span>`:''}${p.f?`<span class="n">${p.f}</span>`:''}<span class="n">${wins[id]||0} из ${seen[id]}</span></figure>`;
  }).join('');
  document.getElementById('end').classList.add('on');
}

document.getElementById('helpc').onclick=closeHelp;
document.getElementById('help').onclick=e=>{ if(e.target.id==='help') closeHelp(); };
document.getElementById('skip').onclick=()=>pick(-1);
document.getElementById('quit').onclick=finish;
document.getElementById('save').onclick=()=>{
  const out={when:new Date().toISOString(), pool:POOL.map(p=>({id:p.id,t:p.t,m:p.m||null,f:p.f||null,kind:p.kind,pays:p.pays,spread:p.spread,proof:p.proof,build:p.build})), answers:answers.filter(Boolean)};
  const b=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='idea-duel-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
};
document.getElementById('again').onclick=()=>{
  answers=[]; localStorage.removeItem(KEY); localStorage.removeItem(KEY2);
  SCHED.length=ROUNDS*Math.floor(POOL.length/2)+REPEATS; cur=0;
  document.getElementById('end').classList.remove('on'); render();
};

document.addEventListener('keydown',e=>{
  if(document.getElementById('help').classList.contains('on')){
    if(e.key==='Escape'||e.key==='Enter'||e.key===' '){e.preventDefault();closeHelp();}
    return;
  }
  if(document.getElementById('end').classList.contains('on')) return;
  if(e.key==='?'||e.key==='/'){e.preventDefault();openHelp(0);return;}
  if(e.key==='ArrowLeft'||e.key==='1'||e.key==='a'||e.key==='ф'){e.preventDefault();pick(0)}
  else if(e.key==='ArrowRight'||e.key==='2'||e.key==='d'||e.key==='в'){e.preventDefault();pick(1)}
  else if(e.key==='0'||e.key===' '){e.preventDefault();pick(-1)}
});

render();
</script>
</body>
</html>
